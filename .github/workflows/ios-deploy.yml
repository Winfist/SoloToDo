name: Deploy iOS to TestFlight

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Patch HealthPlugin for Xcode 26 / Swift 6 compatibility
        run: |
          set -euo pipefail
          echo "--- Running HealthPlugin patch ---"
          node patch-health-plugin.js
          echo "--- Verifying patch ---"
          SWIFT_FILE="node_modules/@capgo/capacitor-health/ios/Sources/HealthPlugin/HealthPlugin.swift"
          if grep -q "let impl = self.implementation" "$SWIFT_FILE"; then
            echo "Patch verified successfully."
          else
            echo "Patch verification failed: HealthPlugin.swift was not updated."
            exit 1
          fi

      - name: Patch WidgetBridge for Xcode 26 SPM compatibility
        run: |
          set -euo pipefail
          echo "--- Running WidgetBridge Package.swift patch ---"
          node patch-widget-bridge.cjs
          echo "--- Verifying patch ---"
          PACKAGE_SWIFT="node_modules/capacitor-widget-bridge/Package.swift"
          if grep -q 'targets: \["CapacitorWidgetBridge"\]' "$PACKAGE_SWIFT" && ! grep -q 'name: "WidgetBridgePlugin"' "$PACKAGE_SWIFT"; then
            echo "WidgetBridge patch verified successfully."
          else
            echo "WidgetBridge patch verification failed."
            cat "$PACKAGE_SWIFT"
            exit 1
          fi

      - name: Build Web & Sync Capacitor
        run: npm run build:cap

      - name: Clean DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Patch Widget Extension into Xcode Project
        run: |
          set -euo pipefail
          echo "--- Running Widget Extension patch ---"
          node patch-widget-extension.cjs

      - name: Clean SPM cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Resolve Xcode SPM Dependencies
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath SPM

      - name: Deploy to TestFlight
        working-directory: ios/App
        run: fastlane beta
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_P8_KEY: ${{ secrets.APP_STORE_P8_KEY }}
