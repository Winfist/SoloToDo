name: Deploy iOS to TestFlight

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Patch HealthPlugin for Xcode 26 / Swift 6 compatibility
        run: |
          set -euo pipefail
          echo "--- Running HealthPlugin patch ---"
          node patch-health-plugin.js
          echo "--- Verifying patch ---"
          SWIFT_FILE="node_modules/@capgo/capacitor-health/ios/Sources/HealthPlugin/HealthPlugin.swift"
          if grep -q "let impl = self.implementation" "$SWIFT_FILE"; then
            echo "Patch verified successfully."
          else
            echo "Patch verification failed: HealthPlugin.swift was not updated."
            exit 1
          fi

      - name: Build Web & Sync Capacitor
        run: npm run build:cap

      - name: Fix broken CapacitorWidgetBridge SPM reference
        run: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          echo "--- Removing direct CapacitorWidgetBridge references from pbxproj ---"
          echo "=== Before: CapacitorWidgetBridge lines ==="
          grep -n 'CapacitorWidgetBridge' "$PBXPROJ" || echo "(none found in pbxproj)"
          echo ""
          echo "=== Before: capacitor-widget-bridge lines ==="
          grep -n 'capacitor-widget-bridge' "$PBXPROJ" || echo "(none found in pbxproj)"
          echo ""
          # Remove direct CapacitorWidgetBridge product dependency entries from pbxproj
          # (NOT the CapApp-SPM reference which is the wrapper - those are fine)
          # These cause Xcode 26 to generate broken hash GUIDs (0ca3007d...)
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('$PBXPROJ', 'utf-8');
          const before = content.length;

          // 1. Remove XCSwiftPackageProductDependency blocks for CapacitorWidgetBridge
          content = content.replace(/\t\t[A-F0-9]{24} \/\* CapacitorWidgetBridge \*\/ = \{[^}]*isa = XCSwiftPackageProductDependency;[^}]*productName = CapacitorWidgetBridge;[^}]*\};?\n/gs, '');

          // 2. Remove PBXBuildFile entries referencing CapacitorWidgetBridge (not via CapApp-SPM)
          content = content.replace(/\t\t[A-F0-9]{24} \/\* CapacitorWidgetBridge [^*]*\*\/ = \{isa = PBXBuildFile;[^}]*CapacitorWidgetBridge[^}]*\};\n/g, '');

          // 3. Remove CapacitorWidgetBridge from packageProductDependencies arrays
          content = content.replace(/\t{4,}[A-F0-9]{24} \/\* CapacitorWidgetBridge \*\/,?\n/g, '');

          // 4. Remove XCLocalSwiftPackageReference for capacitor-widget-bridge
          content = content.replace(/\t\t[A-F0-9]{24} \/\* XCLocalSwiftPackageReference \"capacitor-widget-bridge\" \*\/ = \{[^}]*\};?\n/gs, '');

          // 5. Remove capacitor-widget-bridge from project package references
          content = content.replace(/\t{4,}[A-F0-9]{24} \/\* XCLocalSwiftPackageReference \"capacitor-widget-bridge\" \*\/,?\n/g, '');

          const after = content.length;
          fs.writeFileSync('$PBXPROJ', content);
          console.log('Removed ' + (before - after) + ' characters of CapacitorWidgetBridge references');
          "
          echo ""
          echo "=== After: CapacitorWidgetBridge lines ==="
          grep -n 'CapacitorWidgetBridge' "$PBXPROJ" || echo "(none - clean!)"
          echo ""
          echo "=== After: capacitor-widget-bridge lines ==="
          grep -n 'capacitor-widget-bridge' "$PBXPROJ" || echo "(none - clean!)"

      - name: Patch Widget Extension into Xcode Project
        run: |
          set -euo pipefail
          echo "--- Running Widget Extension patch ---"
          node patch-widget-extension.cjs
          echo "--- Verifying widget patch ---"
          if grep -q "SoloToDoWidgetExtension" ios/App/App.xcodeproj/project.pbxproj; then
            echo "Widget Extension patch verified successfully."
          else
            echo "Widget Extension patch verification failed."
            exit 1
          fi

      - name: Clean SPM cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Resolve Xcode SPM Dependencies
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath SPM

      - name: Deploy to TestFlight
        working-directory: ios/App
        run: fastlane beta
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_P8_KEY: ${{ secrets.APP_STORE_P8_KEY }}
