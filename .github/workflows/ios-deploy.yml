name: Deploy iOS to TestFlight

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Patch HealthPlugin for Xcode 26 / Swift 6 compatibility
        run: |
          set -euo pipefail
          echo "--- Running HealthPlugin patch ---"
          node patch-health-plugin.js
          echo "--- Verifying patch ---"
          SWIFT_FILE="node_modules/@capgo/capacitor-health/ios/Sources/HealthPlugin/HealthPlugin.swift"
          if grep -q "let impl = self.implementation" "$SWIFT_FILE"; then
            echo "Patch verified successfully."
          else
            echo "Patch verification failed: HealthPlugin.swift was not updated."
            exit 1
          fi

      - name: Build Web & Sync Capacitor
        run: npm run build:cap

      - name: Fix broken SPM reference from Capacitor sync
        run: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          echo "--- Checking for broken SPM hash-based GUIDs ---"
          if grep -q '0ca3007d900a678c2b4d53418799ee3d' "$PBXPROJ"; then
            echo "Found broken CapacitorWidgetBridge SPM reference, removing..."
            sed -i '' '/0ca3007d900a678c2b4d53418799ee3d/d' "$PBXPROJ"
            echo "Cleaned up broken reference."
          else
            echo "No broken SPM references found."
          fi
          echo "--- Verifying pbxproj is clean ---"
          if grep -q '0ca3007d900a678c2b4d53418799ee3d' "$PBXPROJ"; then
            echo "ERROR: Broken reference still present!"
            exit 1
          else
            echo "pbxproj is clean."
          fi

      - name: Patch Widget Extension into Xcode Project
        run: |
          set -euo pipefail
          echo "--- Running Widget Extension patch ---"
          node patch-widget-extension.cjs
          echo "--- Verifying widget patch ---"
          if grep -q "SoloToDoWidgetExtension" ios/App/App.xcodeproj/project.pbxproj; then
            echo "Widget Extension patch verified successfully."
          else
            echo "Widget Extension patch verification failed."
            exit 1
          fi

      - name: Clean SPM cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Resolve Xcode SPM Dependencies
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath SPM

      - name: Deploy to TestFlight
        working-directory: ios/App
        run: fastlane beta
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_P8_KEY: ${{ secrets.APP_STORE_P8_KEY }}
