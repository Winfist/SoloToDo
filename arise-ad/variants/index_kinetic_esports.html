<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1080,height=1920"/>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1920px;overflow:hidden;background:#050505;color:#fff;font-family:'Inter',sans-serif;perspective:1200px}
    .clip{position:absolute;inset:0;overflow:hidden}

    /* ── KINETIC HOOK (0-3s) ── */
    #s1{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050505;z-index:50}
    .kinetic-word{position:absolute;font-weight:900;font-size:200px;letter-spacing:-10px;text-transform:uppercase;color:#fff;opacity:0;transform:scale(4);filter:blur(20px)}
    .kinetic-word.accent{color:#00f0ff;text-shadow:0 0 80px rgba(0,240,255,0.4)}
    
    /* ── UI SHOWCASE (3-9s) ── */
    #s2{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, #111 0%, #050505 80%);opacity:0}
    .phone-container{position:absolute;left:50%;top:50%;width:700px;height:1360px;margin-left:-350px;margin-top:-680px;transform-style:preserve-3d;transform:rotateX(15deg) rotateY(-12deg) scale(0.9)}
    .phone-body{position:absolute;inset:0;border-radius:60px;background:linear-gradient(180deg, #151515, #0a0a0a);border:2px solid rgba(255,255,255,0.05);box-shadow:0 60px 120px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02)}
    
    .ui-top{position:absolute;top:60px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;transform:translateZ(10px)}
    .ui-logo{font-weight:900;font-size:32px;letter-spacing:-1px}
    .ui-badge{padding:8px 20px;border-radius:100px;background:rgba(255,255,255,0.1);font-family:'JetBrains Mono';font-size:16px;color:#fff}

    .glass-card{position:absolute;left:40px;right:40px;background:rgba(20,20,20,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:32px;padding:32px;transform-style:preserve-3d}
    
    #quest-card{top:200px;transform:translateZ(20px)}
    .quest-title{font-weight:700;font-size:34px;margin-bottom:8px}
    .quest-sub{font-family:'JetBrains Mono';color:#00f0ff;font-size:18px}
    .quest-check{position:absolute;right:32px;top:50%;margin-top:-24px;width:48px;height:48px;border:3px solid rgba(255,255,255,0.2);border-radius:16px}
    .check-fill{position:absolute;inset:-3px;background:#00f0ff;border-radius:16px;opacity:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,240,255,0.5)}
    .check-fill::after{content:'';width:12px;height:24px;border:solid #000;border-width:0 4px 4px 0;transform:rotate(45deg);margin-top:-6px}

    #xp-card{top:420px;transform:translateZ(15px)}
    .xp-header{display:flex;justify-content:space-between;font-weight:700;font-size:22px;margin-bottom:20px;color:#888}
    .xp-val{font-family:'JetBrains Mono';color:#fff}
    .xp-track{height:16px;background:rgba(0,0,0,0.5);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
    .xp-fill{width:20%;height:100%;background:#fff;box-shadow:0 0 20px #fff}

    #stats-card{top:640px;transform:translateZ(15px)}
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .stat-box{background:rgba(0,0,0,0.4);border-radius:20px;padding:30px;text-align:center;border:1px solid rgba(255,255,255,0.03)}
    .stat-num{font-family:'JetBrains Mono';font-weight:800;font-size:54px;color:#fff}
    .stat-lbl{font-weight:700;font-size:16px;color:#666;letter-spacing:2px;margin-top:10px}

    .shatter-flare{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, #00f0ff 0%, transparent 60%);mix-blend-mode:screen;opacity:0;pointer-events:none;transform:translateZ(100px)}

    /* ── EPIC PAYOFF (9-12s) ── */
    #s3{position:absolute;inset:0;background:#050505;display:flex;align-items:center;justify-content:center;opacity:0}
    .s-rank-text{position:absolute;font-weight:900;font-size:240px;letter-spacing:-10px;color:rgba(255,255,255,0.03);text-transform:uppercase}
    .shadow-igris{position:absolute;width:900px;bottom:100px;filter:drop-shadow(0 0 60px rgba(0,240,255,0.2));opacity:0;transform:scale(1.1)}
    
    /* ── ELITE CTA (12-15s) ── */
    #s4{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
    .cta-logo{font-weight:900;font-size:120px;letter-spacing:-6px;color:#fff;margin-bottom:30px}
    .cta-sub{font-weight:700;font-size:40px;letter-spacing:-1px;color:#888}
    .cta-btn{margin-top:80px;padding:30px 80px;background:#fff;color:#000;font-weight:900;font-size:32px;border-radius:100px}
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-fps="30" data-width="1080" data-height="1920">
    
    <!-- S1: KINETIC HOOK -->
    <section id="s1" class="clip" data-start="0" data-duration="3.5" data-track-index="0">
      <div id="kw1" class="kinetic-word">STOP</div>
      <div id="kw2" class="kinetic-word">DOOM</div>
      <div id="kw3" class="kinetic-word accent">SCROLLING.</div>
    </section>

    <!-- S2: UI SHOWCASE -->
    <section id="s2" class="clip" data-start="3" data-duration="6.5" data-track-index="1">
      <div class="phone-container" id="phone-cont">
        <div class="phone-body"></div>
        <div class="ui-top">
          <div class="ui-logo">SoloToDo</div>
          <div class="ui-badge" id="lvl-badge">LVL 12</div>
        </div>
        
        <div class="glass-card" id="quest-card">
          <div class="quest-title">100 Pushups</div>
          <div class="quest-sub">STR Quest • +400 XP</div>
          <div class="quest-check"><div id="q-fill" class="check-fill"></div></div>
        </div>

        <div class="glass-card" id="xp-card">
          <div class="xp-header"><span>RANK PROGRESSION</span> <span id="xp-val" class="xp-val">4,200 / 5,000 XP</span></div>
          <div class="xp-track"><div id="xp-fill" class="xp-fill"></div></div>
        </div>

        <div class="glass-card" id="stats-card">
          <div class="stats-grid">
            <div class="stat-box"><div id="stat-str" class="stat-num">24</div><div class="stat-lbl">STRENGTH</div></div>
            <div class="stat-box"><div id="stat-int" class="stat-num">42</div><div class="stat-lbl">INTELLIGENCE</div></div>
          </div>
        </div>
        
        <div id="shatter-flare" class="shatter-flare"></div>
      </div>
    </section>

    <!-- S3: PAYOFF -->
    <section id="s3" class="clip" data-start="9" data-duration="3.5" data-track-index="2">
      <div id="s-rank" class="s-rank-text">S-RANG</div>
      <img id="igris" class="shadow-igris" src="../assets/shadow_igris.webp" alt="Shadow Igris"/>
    </section>

    <!-- S4: CTA -->
    <section id="s4" class="clip" data-start="12.5" data-duration="2.5" data-track-index="3">
      <div id="cta-logo" class="cta-logo">SoloToDo</div>
      <div id="cta-sub" class="cta-sub">Dein Leben. Dein RPG.</div>
      <div id="cta-btn" class="cta-btn">Kostenlos Downloaden</div>
    </section>

    <audio id="bgm" data-start="0" data-duration="15" data-track-index="4" data-volume="0.8" src="../assets/solo_grind_ad_cut.mp3"></audio>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Custom snappy easing for esports vibe
    const snapEase = "expo.out";
    const impactEase = "back.out(2)";

    /* ── S1: KINETIC HOOK (0 - 3.5s) ── */
    tl.to("#kw1", { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: snapEase }, 0.1);
    tl.to("#kw1", { opacity: 0, scale: 0.8, filter: "blur(10px)", duration: 0.3 }, 0.8);
    
    tl.to("#kw2", { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: snapEase }, 0.9);
    tl.to("#kw2", { opacity: 0, scale: 0.8, filter: "blur(10px)", duration: 0.3 }, 1.6);
    
    tl.to("#kw3", { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: impactEase }, 1.7);
    // Hard zoom through the word
    tl.to("#kw3", { scale: 30, opacity: 0, filter: "blur(20px)", duration: 0.8, ease: "power4.in" }, 2.5);
    tl.to("#s1", { opacity: 0, duration: 0.1 }, 3.3);

    /* ── S2: UI SHOWCASE (3 - 9s) ── */
    tl.set("#s2", { opacity: 1 }, 3.0);
    tl.fromTo("#phone-cont", { z: -1000, rotationX: 30, rotationY: -30, opacity: 0 }, { z: 0, rotationX: 10, rotationY: -8, opacity: 1, duration: 1.2, ease: "power4.out" }, 2.8);
    
    // Impact 1: Check Quest
    tl.to("#q-fill", { opacity: 1, duration: 0.1 }, 4.2);
    // Quest Card Detach & Shatter
    tl.to("#quest-card", { z: 300, rotationX: 20, rotationY: 20, scale: 1.2, duration: 0.6, ease: "power3.out" }, 4.3);
    tl.to("#shatter-flare", { opacity: 1, duration: 0.1 }, 4.8);
    tl.to("#quest-card", { opacity: 0, scale: 1.5, filter: "blur(20px)", duration: 0.3 }, 4.8);
    tl.to("#shatter-flare", { opacity: 0, duration: 0.5 }, 4.9);
    
    // Impact 2: XP shoots up
    tl.to("#phone-cont", { rotationX: 12, rotationY: -5, duration: 0.8, ease: "power2.out" }, 4.8);
    tl.to("#xp-card", { z: 50, duration: 0.4, ease: snapEase }, 4.9);
    tl.to("#xp-fill", { width: "100%", background: "#00f0ff", boxShadow: "0 0 30px #00f0ff", duration: 0.6, ease: "power3.inOut" }, 5.0);
    
    let xpObj = { val: 4200 };
    tl.to(xpObj, { 
      val: 5000, 
      duration: 0.6, 
      ease: "power3.inOut",
      onUpdate: () => { document.getElementById("xp-val").innerHTML = Math.round(xpObj.val).toLocaleString('en-US') + " / 5,000 XP"; }
    }, 5.0);
    tl.to("#lvl-badge", { innerHTML: "LVL 13", color: "#00f0ff", background: "rgba(0,240,255,0.2)", duration: 0.1 }, 5.6);
    tl.to("#xp-card", { z: 15, duration: 0.4, ease: "power2.in" }, 5.8);

    // Impact 3: Stats roll
    tl.to("#stats-card", { z: 50, duration: 0.4, ease: snapEase }, 6.0);
    tl.to("#stat-str", { innerHTML: "45", duration: 0.5, snap: "innerHTML", ease: "none", color: "#00f0ff" }, 6.2);
    tl.to("#stat-int", { innerHTML: "60", duration: 0.5, snap: "innerHTML", ease: "none", color: "#00f0ff" }, 6.3);
    tl.to("#stats-card", { z: 15, duration: 0.4, ease: "power2.in" }, 6.8);

    // Exit
    tl.to("#phone-cont", { z: -800, rotationX: -10, opacity: 0, duration: 0.8, ease: "power3.in" }, 8.2);
    tl.to("#s2", { opacity: 0, duration: 0.2 }, 9.0);

    /* ── S3: PAYOFF (9 - 12.5s) ── */
    tl.set("#s3", { opacity: 1 }, 9.0);
    tl.to("#s-rank", { color: "rgba(255,255,255,0.9)", textShadow: "0 0 60px rgba(0,240,255,0.5)", duration: 0.1 }, 9.2);
    tl.to("#s-rank", { color: "rgba(255,255,255,0.03)", textShadow: "none", duration: 0.8, ease: "power2.out" }, 9.4);
    
    tl.to("#igris", { opacity: 1, scale: 1, duration: 1.5, ease: "power4.out" }, 9.2);
    // Subtle float
    tl.to("#igris", { y: -20, duration: 2, ease: "sine.inOut" }, 10.0);
    
    tl.to("#s3", { opacity: 0, scale: 1.2, duration: 0.6, ease: "power3.in" }, 12.0);

    /* ── S4: CTA (12.5 - 15s) ── */
    tl.set("#s4", { opacity: 1 }, 12.5);
    tl.fromTo("#cta-logo", { opacity: 0, scale: 0.5, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: impactEase }, 12.6);
    tl.fromTo("#cta-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 13.0);
    tl.fromTo("#cta-btn", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: impactEase }, 13.2);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
