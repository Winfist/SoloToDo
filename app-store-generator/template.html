<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>App Store Premium Panorama</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden; background-color: #030305; color: #fff;
    }

    /* Ambient Glow Background */
    .ambient-glow {
      position: absolute; top: -20%; left: -20%; right: -20%; bottom: -20%;
      background-size: cover; background-position: center;
      filter: blur(120px) brightness(0.4) saturate(1.3);
      opacity: 0.7; z-index: 0;
    }

    /* Typography */
    .text-block { position: absolute; z-index: 20; display: flex; flex-direction: column; }
    
    .title {
      font-size: 4.5vw; 
      font-weight: 900; line-height: 1.05; letter-spacing: -0.03em;
      text-shadow: 0 10px 40px rgba(0,0,0,0.8);
      background: linear-gradient(135deg, #ffffff 0%, #d1d1d6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: pre-line; margin-bottom: 1.5vh;
    }
    
    .subtitle {
      font-size: 1.6vw; font-weight: 700; color: #a1a1a6;
      text-shadow: 0 4px 10px rgba(0,0,0,0.6); white-space: pre-line;
    }

    /* --- THE PERFECT iPHONE MOCKUP --- */
    .phone-mockup {
      position: absolute; z-index: 10;
      width: 22vw; 
      aspect-ratio: 9 / 19.5; /* EXACT iPhone Proportion */
      background: #000;
      border-radius: 3.2vw; /* Adjusted for realistic corner */
      padding: 0.7vw; /* Exact Bezel thickness */
      box-sizing: border-box;
      box-shadow: 
        0 4vw 8vw rgba(0,0,0,0.8),
        inset 0 0 0 0.15vw #66666a, /* Titanium edge */
        inset 0.1vw 0.1vw 0.3vw rgba(255,255,255,0.4),
        inset -0.1vw -0.1vw 0.3vw rgba(0,0,0,0.8);
    }

    .phone-screen {
      width: 100%; height: 100%; border-radius: 2.6vw; /* Inner corner radius */
      overflow: hidden; position: relative; background: #111;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    .dynamic-island {
      position: absolute; top: 0.8vw; left: 50%; transform: translateX(-50%);
      width: 7vw; height: 2vw; background: #000; border-radius: 1vw; z-index: 15;
    }

    /* Glossy Glass Reflection */
    .glare {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(115deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.01) 40%, transparent 40%);
      z-index: 12; pointer-events: none;
    }

    .phone-screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

    /* Physical Buttons */
    .btn { position: absolute; background: linear-gradient(to right, #444, #777); width: 0.15vw; border-radius: 0.1vw; }
    .btn-action { height: 1.8vw; left: -0.15vw; top: 8vw; }
    .btn-vol-up { height: 3.5vw; left: -0.15vw; top: 11vw; }
    .btn-vol-down { height: 3.5vw; left: -0.15vw; top: 15vw; }
    .btn-power { height: 5vw; right: -0.15vw; top: 13vw; }


    /* --- SPREAD LAYOUTS --- */

    /* 1. Split Center (Hero spanning exactly across both images) */
    .layout-split-center .text-left { left: 5vw; top: 20vh; width: 40vw; }
    .layout-split-center .text-right { left: 55vw; top: 60vh; width: 40vw; text-align: right; align-items: flex-end;}
    
    .layout-split-center .phone-a {
      /* perfectly centered on the seam (50vw) */
      left: 50vw; top: 52vh; transform: translate(-50%, -50%) scale(1.15); z-index: 15;
    }
    .layout-split-center .phone-b {
      left: 82vw; top: 40vh; transform: translate(-50%, -50%) rotate(6deg) scale(0.85); z-index: 5; opacity: 0.9;
    }

    /* 2. Split Overlap (Two phones boldly overlapping the center seam) */
    .layout-split-overlap .text-left { left: 5vw; top: 15vh; width: 40vw; }
    .layout-split-overlap .text-right { left: 55vw; top: 15vh; width: 40vw; text-align: right; align-items: flex-end;}
    
    .layout-split-overlap .phone-a {
      /* Pushed into the center to cross the seam into the next screen */
      left: 44vw; top: 62vh; transform: translate(-50%, -50%) rotate(-5deg) scale(0.95); z-index: 10;
    }
    .layout-split-overlap .phone-b {
      /* Pushed left into the first screen */
      left: 56vw; top: 55vh; transform: translate(-50%, -50%) rotate(5deg) scale(1.05); z-index: 15;
      box-shadow: -2vw 2vw 5vw rgba(0,0,0,0.9), inset 0 0 0 0.15vw #66666a;
    }

    /* 3. Single Canvas (We just render on the left half, output only 1 image) */
    .layout-single .text-right { display: none; }
    .layout-single .phone-b { display: none; }
    
    .layout-single .text-left { left: 5vw; top: 12vh; width: 40vw; text-align: center; }
    .layout-single .phone-a {
      left: 25vw; /* Center of the left screen */
      top: 62vh; transform: translate(-50%, -50%) scale(1.05); z-index: 15;
    }

  </style>
</head>
<body id="body-layout" class="layout-split-center">
  <div class="ambient-glow" id="glow"></div>

  <!-- Texts -->
  <div class="text-block text-left">
    <div class="title" id="title-a">Title A</div>
    <div class="subtitle" id="sub-a">Subtitle A</div>
  </div>
  <div class="text-block text-right">
    <div class="title" id="title-b">Title B</div>
    <div class="subtitle" id="sub-b">Subtitle B</div>
  </div>

  <!-- iPhones -->
  <div class="phone-mockup phone-a">
    <div class="btn btn-action"></div><div class="btn btn-vol-up"></div><div class="btn btn-vol-down"></div><div class="btn btn-power"></div>
    <div class="phone-screen">
      <div class="dynamic-island"></div>
      <div class="glare"></div>
      <img id="img-a" src="" alt="A">
    </div>
  </div>

  <div class="phone-mockup phone-b">
    <div class="btn btn-action"></div><div class="btn btn-vol-up"></div><div class="btn btn-vol-down"></div><div class="btn btn-power"></div>
    <div class="phone-screen">
      <div class="dynamic-island"></div>
      <div class="glare"></div>
      <img id="img-b" src="" alt="B">
    </div>
  </div>

</body>
</html>
